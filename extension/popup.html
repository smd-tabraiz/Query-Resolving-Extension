<!DOCTYPE html>
<html>
<head>
  <style>
    body { width: 300px; padding: 20px; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0f172a; color: white; }
    h2 { font-size: 1.2rem; margin-bottom: 20px; color: #38bdf8; }
    input { width: 100%; padding: 8px; margin-bottom: 10px; border-radius: 4px; border: 1px solid #334155; background: #1e293b; color: white; box-sizing: border-box; }
    button { width: 100%; padding: 10px; background: #0284c7; color: white; border: none; border-radius: 4px; cursor: pointer; transition: background 0.3s; }
    button:hover { background: #0369a1; }
    .status { margin-top: 15px; font-size: 0.9rem; text-align: center; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <h2>Search Assistant</h2>
  
  <div id="loginSection">
    <input type="email" id="email" placeholder="Email">
    <input type="password" id="password" placeholder="Password">
    <button id="loginBtn">Login</button>
  </div>

  <div id="statusSection" class="hidden">
    <div class="status" id="userStatus">Logged in as: <span id="username"></span></div>
    <button id="logoutBtn" style="margin-top: 10px; background: #ef4444;">Logout</button>
  </div>

  <div id="msg" class="status"></div>

  <script src="popup.js"></script>
</body>
</html>
